spring.application.name=companyhouse
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/companyhouse
spring.datasource.username=postgres
spring.datasource.password=postgres
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
springdoc.swagger-ui.enabled=true
app.security.username=${API_USERNAME:admin}
app.security.password=${API_PASSWORD:admin123}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=1000ms
cache.l1.max-size=50000

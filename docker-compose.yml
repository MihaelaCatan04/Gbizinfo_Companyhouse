services:
  redis:
    image: redis:7-alpine
    container_name: companyhouse-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lfu
      --loglevel notice
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data: